name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install build dependencies and the libraries Qt needs to run
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libusb-1.0-0-dev pkg-config build-essential \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install PySide6 for the GUI smoke test, and pyflakes
        run: |
          python3 -m pip install PySide6-Essentials pyflakes
          python3 -c "from PySide6 import QtNetwork, QtSvg, QtWidgets"
      - name: Build engine
        run: make engine CFLAGS="-O2 -Wall -Wextra -Wno-unused-parameter -Werror"
      - name: Unit tests and the offscreen GUI smoke test
        run: make test
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Byte-compile and pyflakes
        run: make lint
